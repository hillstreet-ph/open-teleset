name = "open-teleset"
main = "deploy/cloudflare-worker.js"
compatibility_date = "2024-11-01"
account_id = "c0e6bd9a7249856cb8497e7fe340e7ce"

[vars]
APP_ENV = "production"
SITE_URL = "https://open-teleset.site"
R2_BUCKET = "open-teleset"
R2_BUCKET_ASSETS = "open-teleset-assets"

# R2 bindings
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "open-teleset"

[[r2_buckets]]
binding = "BUCKET_PROD"
bucket_name = "open-teleset-prod"

[[r2_buckets]]
binding = "BUCKET_ASSETS"
bucket_name = "open-teleset-assets"

# NOTE: Domain routes for open-teleset.site are managed by setup-domain.yml workflow.
# Keeping routes here would require the zone to be fully active at deploy time;
# the dedicated setup-domain workflow handles this independently.
