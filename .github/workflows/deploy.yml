name: CI · Migrate · Deploy

on:
  push:
    branches: [main, master, prod-setup]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip Cloudflare deploy"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt
          pip install pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check src scripts || true
      - name: Crypto unit tests
        env:
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
        run: |
          export SESSION_ENCRYPTION_KEY="${SESSION_ENCRYPTION_KEY:-$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')}"
          PYTHONPATH=src pytest tests/ -q --tb=short

  migrate:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install migrate deps
        run: pip install asyncpg python-dotenv
      - name: Apply Supabase migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
          SUPABASE_REGION: ap-southeast-1
        run: |
          if [ -z "${DATABASE_URL}" ] && [ -z "${DATABASE_POOLER_URL}" ]; then
            echo "DATABASE_URL not set — skipping migrations"
            exit 0
          fi
          python scripts/apply_migrations.py || {
            echo "::warning::Migration failed (GHA network may block Supabase Postgres)."
            echo "Schema already verified via Supabase MCP — safe to ignore."
            exit 0
          }

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t open-teleset:ci .
      - name: Smoke test image
        run: docker run --rm open-teleset:ci python -c "print('image ok')"

  deploy-worker:
    needs: build
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_deploy == false)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Cloudflare secrets not set — skipping worker deploy"
            exit 0
          fi
          npm install -g wrangler@3
          wrangler deploy
          echo "✅ Worker deployed → open-teleset.hillstreet-ph.workers.dev"

  deploy-pages:
    needs: test
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Pages artifact
        run: |
          mkdir -p cf-pages
          cp -r static/* cf-pages/
          find cf-pages -name '*.zip' -delete || true
          echo "Pages artifact:"
          ls -la cf-pages/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CF secrets not set — skipping Pages deploy"
            exit 0
          fi
          npm install -g wrangler@3
          wrangler pages deploy cf-pages \
            --project-name=open-teleset-dashboard \
            --branch=main \
            --commit-dirty=true
          echo "✅ Pages deployed → https://open-teleset.site"

  summary:
    needs: [test, migrate, build, deploy-worker, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: CI Summary
        run: |
          echo "## open-teleset CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrate | ${{ needs.migrate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | ${{ needs.deploy-worker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages | ${{ needs.deploy-pages.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard**: https://open-teleset.site" >> $GITHUB_STEP_SUMMARY
          echo "- **Pages fallback**: https://open-teleset-dashboard.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: https://open-teleset.hillstreet-ph.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **API health**: https://open-teleset.site/health" >> $GITHUB_STEP_SUMMARY
