name: Validate · Self-heal checks

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  provider-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read-only provider configuration evidence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: python scripts/provider_preflight.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements-prod.txt
          pip install pytest pytest-asyncio ruff
      - name: Ruff
        run: ruff check src scripts || true
      - name: Unit tests
        run: |
          export SESSION_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          PYTHONPATH=src pytest tests/ -q --tb=short
      - name: Migration dry-run syntax
        run: |
          for f in migrations/*.sql; do
            echo "OK $f ($(wc -l < $f) lines)"
          done
      - name: Version file present
        run: test -s VERSION && cat VERSION
