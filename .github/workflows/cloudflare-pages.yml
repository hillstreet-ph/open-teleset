name: Cloudflare Pages (dashboard static)

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p cf-pages
          cp -r static/* cf-pages/
          # Drop large zip archives from Pages publish
          find cf-pages -name '*.zip' -delete || true
          ls -la cf-pages/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CF secrets missing — skipping"
            exit 0
          fi
          # Use Direct Upload API (no wrangler version issues)
          pip install requests 2>/dev/null || true
          python3 - << 'PYEOF'
          import requests, os, mimetypes, json
          from pathlib import Path

          TOKEN   = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          PROJECT = "open-teleset-dashboard"
          DIR     = Path("cf-pages")
          HEADERS = {"Authorization": f"Bearer {TOKEN}"}

          # 1. Create a deployment
          r = requests.post(
              f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/pages/projects/{PROJECT}/deployments",
              headers=HEADERS
          )
          print(f"Create deployment: {r.status_code}")
          if not r.ok:
              print(r.text[:400])

          # 2. Try wrangler as fallback
          import subprocess, sys
          result = subprocess.run(
              ["npx", "--yes", "wrangler@3", "pages", "deploy", str(DIR),
               "--project-name", PROJECT, "--branch", "main", "--commit-dirty=true"],
              capture_output=True, text=True
          )
          print(result.stdout[-2000:])
          if result.returncode != 0:
              print("STDERR:", result.stderr[-1000:])
              # Try with wrangler@latest
              result2 = subprocess.run(
                  ["npx", "--yes", "wrangler@latest", "pages", "deploy", str(DIR),
                   "--project-name", PROJECT, "--branch", "main", "--commit-dirty=true"],
                  capture_output=True, text=True, env={**os.environ}
              )
              print("wrangler@latest:", result2.stdout[-2000:])
              if result2.returncode != 0:
                  print("STDERR:", result2.stderr[-500:])
                  sys.exit(1)
              else:
                  print("✅ Deployed with wrangler@latest")
          else:
              print("✅ Deployed with wrangler@3")
          PYEOF

      - name: "Attach open-teleset.site custom domain"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - << 'PYEOF'
          import requests, json, os

          TOKEN   = os.environ.get("CLOUDFLARE_API_TOKEN","")
          ACCOUNT = os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          if not TOKEN or not ACCOUNT:
              print("Skipping — no CF credentials")
              exit(0)

          HEADERS = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}
          BASE = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/pages/projects/open-teleset-dashboard/domains"

          for domain in ["open-teleset.site", "www.open-teleset.site"]:
              r = requests.post(BASE, headers=HEADERS, json={"name": domain})
              d = r.json()
              if d.get("success"):
                  print(f"✅ Attached: {domain}")
              elif any(e.get("code") in (8000014, 8000037) for e in d.get("errors",[])):
                  print(f"ℹ️  Already attached: {domain}")
              else:
                  print(f"⚠️  {domain}: {d.get('errors','')}")
          PYEOF

      - name: "✅ Summary"
        run: |
          echo "Dashboard deployed:"
          echo "  Primary:  https://open-teleset.site"
          echo "  Fallback: https://open-teleset-dashboard.pages.dev"
