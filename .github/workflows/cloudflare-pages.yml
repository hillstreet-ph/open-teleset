name: Cloudflare Pages (dashboard static)

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "deploy/cloudflare-pages/**"
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare Pages artifact
        run: |
          mkdir -p cf-pages
          cp -r static/* cf-pages/
          echo "open-teleset dashboard" > cf-pages/README.txt
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CF secrets missing — skip Pages publish"
            exit 0
          fi
          npm install -g wrangler@3
          npx wrangler pages deploy cf-pages \
            --project-name=open-teleset-dashboard \
            --commit-dirty=true || echo "Create Pages project 'open-teleset-dashboard' in CF dashboard first"
