name: Cloudflare Pages (dashboard static)

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare Pages artifact
        run: |
          mkdir -p cf-pages
          cp -r static/* cf-pages/
          # Prefer dashboard as site root
          if [ -f cf-pages/dashboard.html ] && [ ! -f cf-pages/index.html ]; then
            cp cf-pages/dashboard.html cf-pages/index.html
          fi
          # Drop large zip archives from Pages publish
          find cf-pages -name '*.zip' -delete || true

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CF secrets missing"
            exit 1
          fi
          npm install -g wrangler@3
          wrangler pages deploy cf-pages \
            --project-name=open-teleset-dashboard \
            --branch=main \
            --commit-dirty=true
