name: _discover-zone-id

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: List all Cloudflare zones
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Zones via Bearer token ==="
          curl -s "https://api.cloudflare.com/client/v4/zones?per_page=50" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" | python3 -c "
import sys, json
d = json.load(sys.stdin)
zones = d.get('result', [])
print(f'Found {len(zones)} zones:')
for z in zones:
    print(f\"  {z['name']:30s}  id={z['id']}  status={z.get('status')}\")
" || echo "Bearer auth failed"

          echo ""
          echo "=== Zones via Global API Key ==="
          curl -s "https://api.cloudflare.com/client/v4/zones?per_page=50" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_GLOBAL_KEY}" \
            -H "Content-Type: application/json" | python3 -c "
import sys, json
d = json.load(sys.stdin)
zones = d.get('result', [])
print(f'Found {len(zones)} zones:')
for z in zones:
    print(f\"  {z['name']:30s}  id={z['id']}  status={z.get('status')}\")
" || echo "Global key auth failed"
