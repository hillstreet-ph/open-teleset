name: Production CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-production.txt pytest ruff bandit pip-audit
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Fatal lint checks for legacy code
        run: ruff check . --select E9,F63,F7,F82
      - name: Full lint for production security modules
        run: ruff check production_security.py session_crypto.py
      - name: High-confidence security scan
        run: bandit -q -r . --severity-level high --confidence-level high -x ./test_comprehensive.py,./test_edge_cases.py,./test_new_features.py,./test_tools.py,./test_web.py
      - run: pip-audit -r requirements-production.txt
      - run: pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: false
          tags: open-teleset:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks CLI
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0             git /repo --redact --no-banner
