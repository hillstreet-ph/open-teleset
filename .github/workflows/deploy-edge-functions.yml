name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release-gates:
    uses: ./.github/workflows/verify-release-gates.yml

  deploy-functions:
    needs: release-gates
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          PROJECT_ID: hoseohvgoiarxluxqwqv
        run: |
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            echo "Deploying: $name"
            flags=()
            if [ "$name" = health-ping ]; then flags+=(--no-verify-jwt); fi
            supabase functions deploy "$name" --project-ref "$PROJECT_ID" "${flags[@]}"
          done
          echo "✅ Edge function deployment complete"
