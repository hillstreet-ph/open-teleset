name: Configure Worker Secrets

on:
  workflow_dispatch:

jobs:
  configure-secrets:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g wrangler@3

      - name: Set ORIGIN secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "https://open-teleset-prod.zeabur.app" | wrangler secret put ORIGIN
          echo "ORIGIN configured"

      - name: Set SESSION_ENCRYPTION_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
        run: |
          if [ -n "$SESSION_KEY" ]; then
            echo "$SESSION_KEY" | wrangler secret put SESSION_ENCRYPTION_KEY
            echo "SESSION_ENCRYPTION_KEY configured"
          else
            echo "SESSION_ENCRYPTION_KEY not in GitHub Secrets - skipping"
          fi

      - name: Verify Worker proxying
        run: |
          sleep 5
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://open-teleset.hillstreet-ph.workers.dev/health 2>/dev/null || echo "000")
          echo "Worker health status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Worker is proxying to backend"
          else
            echo "Worker returned $STATUS - may need a moment to propagate"
          fi
