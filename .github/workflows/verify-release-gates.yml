name: Verify existing release gates

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  verified-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'deploy.yml', head_sha: context.sha,
              branch: 'main', event: 'push', per_page: 20
            });
            const run = response.data.workflow_runs[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed('The current commit requires a successful main CI/migration run before a standalone release.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100
            });
            for (const name of ['test', 'container-test', 'migrate']) {
              if (!jobs.some(job => job.name === name && job.conclusion === 'success')) {
                core.setFailed(`Missing successful required release gate: ${name}`);
                return;
              }
            }
            core.info(`Verified tests, container and migration for ${context.sha} via run ${run.id}`);
