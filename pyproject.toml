[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp-complete"
version = "1.0.0"
description = "Complete Telegram MCP Server with QR Code Login"
authors = [{name = "User"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.30.0,<2",
    "telethon>=1.39.0",
    "python-dotenv>=1.1.0",
    "flask>=3.0.0",
    "playwright>=1.40.0",
    "aiohttp>=3.9.0",
    "nest-asyncio>=1.6.0",
]

[project.scripts]
telegram-mcp = "main:main"

[tool.setuptools]
py-modules = ["main", "web_login", "session_manager"]

[tool.black]
line-length = 99
target-version = ['py311']

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
# Deterministic, non-opinionated selection. CI lints `src scripts` only.
# E/F = pycodestyle+pyflakes, I = import sorting, UP = pyupgrade modernization,
# RUF = ruff-specific, EXE = shebang/executable hygiene.
select = ["E", "F", "I", "UP", "RUF", "EXE"]
# Line length is enforced by black (line-length = 99); don't double-report it.
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
# Root-level test_*.py files are credential-dependent manual scripts; keep
# automatic discovery on the real suite so a bare `pytest` stays green.
testpaths = ["tests"]
