# Codemagic CI/CD — Open-Teleset
# Stack: Python 3.12 Telegram automation.
# Validate only. Production deploy stays on the existing platform
# (Docker / Cloudflare edge). Mirrors the GitHub Actions validate step.

workflows:
  open-teleset-validate:
    name: Open-Teleset Validate
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      python: 3.12
    triggering:
      events:
        - push
        - pull_request
      cancel_previous_builds: true
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          pip install -r requirements-prod.txt
          pip install pytest ruff
      - name: Lint (ruff)
        script: ruff check src scripts || true
      - name: Tests
        script: PYTHONPATH=src pytest tests/ -q --tb=short
